name: Python tests
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  unittest:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install the package
        run: python -m pip install .
      - name: Test
        env:
          PYTHONDONTWRITEBYTECODE: '1'
        run: python -B -m unittest discover -s tests -v
